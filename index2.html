<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Details</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="submit.js"></script>
</head>
<body>
  <div class="page-shell">
    <div class="form-card">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="TeleVU logo" />
      </div>
      <h1>User details</h1>
      <form id="user-details-form" class="onboarding-form">
        <fieldset class="field-group user-details-table-wrapper">
          <table class="user-details-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>User type</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="user-rows">
              <tr class="user-row">
                <td><input type="text" placeholder="Name" /></td>
                <td><input type="email" placeholder="Email" /></td>
                <td><input type="tel" placeholder="Phone" /></td>
                <td>
                  <div class="select-shell small">
                    <select>
                      <option>User</option>
                      <option>Manager</option>
                      <option>Guest</option>
                      <option>Education</option>
                    </select>
                    <span class="select-icon">⌄</span>
                  </div>
                </td>
                <td>
                  <div class="select-shell small">
                    <select class="user-type-select">
                      <option value="" disabled selected>User type</option>
                      <option>RemoteVU - Remote Expert</option>
                      <option>CareVU - Patient Side</option>
                    </select>
                    <span class="select-icon">⌄</span>
                  </div>
                </td>
                <td><button type="button" class="row-action remove-row" aria-label="Remove user row">×</button></td>
              </tr>
              <tr class="user-details-row hidden">
                <td colspan="6">
                  <div class="details-panel">
                    <div class="details-summary">
                      <span class="details-summary-text">CareVU details available</span>
                      <button type="button" class="details-toggle button small">Edit details</button>
                    </div>
                    <div class="details-body hidden">
                      <fieldset class="field-group checkbox-group">
                        <legend class="field-label">Devices requested</legend>
                        <label class="checkbox-item">
                          <input type="checkbox" name="devices" value="GlassVU" />
                          <span>GlassVU - Smart Glasses for AR collaboration</span>
                        </label>
                        <label class="checkbox-item">
                          <input type="checkbox" name="devices" value="ScreenVU" />
                          <span>ScreenVU - Users who need to stream and share real-time video feeds from medical devices.</span>
                        </label>
                        <label class="checkbox-item">
                          <input type="checkbox" name="devices" value="CamVU" />
                          <span>CamVU - Users who want to use a mobile device as a portable camera source.</span>
                        </label>
                        <label class="checkbox-item">
                          <input type="checkbox" name="devices" value="CamVU PTZ" />
                          <span>CamVU PTZ - High-definition Pan-Tilt-Zoom camera for clinical viewing.</span>
                        </label>
                        <label class="checkbox-item">
                          <input type="checkbox" name="devices" value="TeleVU Station" />
                          <span>TeleVU Station - Telepresence unit for all-in-one solutions.</span>
                        </label>
                      </fieldset>
                      <label class="field-group">
                        <span class="field-label">Where should the equipment be shipped to?</span>
                        <textarea rows="4" placeholder="Enter shipping address"></textarea>
                      </label>
                      <label class="field-group">
                        <span class="field-label">Please provide any additional information or special instructions for your onboarding</span>
                        <textarea rows="5" placeholder="Enter additional information"></textarea>
                      </label>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <button type="button" id="add-user-row" class="secondary">+ Add user</button>
          <p id="user-limit-note" class="field-note hidden" role="status" aria-live="polite"></p>
        </fieldset>
        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
        <button id="user-submit" type="submit">Submit Request</button>
      </form>
    </div>
  </div>
  <script>
    const addUserRowButton = document.getElementById('add-user-row');
    const userRows = document.getElementById('user-rows');
    const form = document.getElementById('user-details-form');
    const statusBox = document.getElementById('form-status');
    const submitButton = document.getElementById('user-submit');
    const userLimitNote = document.getElementById('user-limit-note');
    const MAIN_FORM_DRAFT_KEY = 'onboardingMainFormDraft';
    const USER_DETAILS_DRAFT_KEY = 'onboardingUserDetailsDraft';

    function readMainFormDraft() {
      try {
        const raw = sessionStorage.getItem(MAIN_FORM_DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function readUserDetailsDraft() {
      try {
        const raw = sessionStorage.getItem(USER_DETAILS_DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function persistUserDetailsDraft() {
      try {
        sessionStorage.setItem(USER_DETAILS_DRAFT_KEY, JSON.stringify({
          source: 'user-details-form',
          mainForm: readMainFormDraft(),
          users: collectUserRows(),
        }));
      } catch (error) {
        // Ignore storage failures and continue submission.
      }
    }

    function clearMainFormDraft() {
      sessionStorage.removeItem(MAIN_FORM_DRAFT_KEY);
    }

    function clearUserDetailsDraft() {
      sessionStorage.removeItem(USER_DETAILS_DRAFT_KEY);
    }

    function setStatus(message, type = 'info') {
      statusBox.textContent = message;
      statusBox.className = `form-status ${type}`;
    }

    function updateCarevuDetails(row, select) {
      const detailsRow = row.nextElementSibling;
      const showDetails = select.value === 'CareVU - Patient Side';
      detailsRow.classList.toggle('hidden', !showDetails);
      if (showDetails) {
        toggleDetailsBody(detailsRow, false);
      }
    }

    function updateAddUserState() {
      const atLimit = userRows.querySelectorAll('.user-row').length >= OnboardingSubmit.MAX_USERS;
      addUserRowButton.disabled = atLimit;
      userLimitNote.textContent = atLimit
        ? `You've reached the maximum of ${OnboardingSubmit.MAX_USERS} users per request. To add more, submit this request and start a new one.`
        : '';
      userLimitNote.classList.toggle('hidden', !atLimit);
    }

    function bindUserTypeListener(row, select) {
      select.addEventListener('change', () => updateCarevuDetails(row, select));
    }

    function toggleDetailsBody(detailsRow, expanded) {
      const detailsBody = detailsRow.querySelector('.details-body');
      const toggleButton = detailsRow.querySelector('.details-toggle');
      detailsBody.classList.toggle('hidden', !expanded);
      toggleButton.textContent = expanded ? 'Hide details' : 'Edit details';
    }

    function bindDetailsToggle(detailsRow) {
      detailsRow.querySelector('.details-toggle').addEventListener('click', () => {
        const detailsBody = detailsRow.querySelector('.details-body');
        toggleDetailsBody(detailsRow, detailsBody.classList.contains('hidden'));
      });
    }

    function createDetailsRow() {
      const row = document.createElement('tr');
      row.className = 'user-details-row hidden';
      row.innerHTML = `
        <td colspan="6">
          <div class="details-panel">
            <div class="details-summary">
              <span class="details-summary-text">CareVU details available</span>
              <button type="button" class="details-toggle button small">Edit details</button>
            </div>
            <div class="details-body hidden">
              <fieldset class="field-group checkbox-group">
                <legend class="field-label">Devices requested</legend>
                <label class="checkbox-item">
                  <input type="checkbox" name="devices" value="GlassVU" />
                  <span>GlassVU - Smart Glasses for AR collaboration</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" name="devices" value="ScreenVU" />
                  <span>ScreenVU - Users who need to stream and share real-time video feeds from medical devices.</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" name="devices" value="CamVU" />
                  <span>CamVU - Users who want to use a mobile device as a portable camera source.</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" name="devices" value="CamVU PTZ" />
                  <span>CamVU PTZ - High-definition Pan-Tilt-Zoom camera for clinical viewing.</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" name="devices" value="TeleVU Station" />
                  <span>TeleVU Station - Telepresence unit for all-in-one solutions.</span>
                </label>
              </fieldset>
              <label class="field-group">
                <span class="field-label">Where should the equipment be shipped to?</span>
                <textarea rows="4" placeholder="Enter shipping address"></textarea>
              </label>
              <label class="field-group">
                <span class="field-label">Please provide any additional information or special instructions for your onboarding</span>
                <textarea rows="5" placeholder="Enter additional information"></textarea>
              </label>
            </div>
          </div>
        </td>
      `;
      bindDetailsToggle(row);
      return row;
    }

    function createUserRow() {
      const row = document.createElement('tr');
      row.className = 'user-row';
      row.innerHTML = `
        <td><input type="text" placeholder="Name" /></td>
        <td><input type="email" placeholder="Email" /></td>
        <td><input type="tel" placeholder="Phone" /></td>
        <td>
          <div class="select-shell small">
            <select>
              <option>User</option>
              <option>Manager</option>
              <option>Guest</option>
              <option>Education</option>
            </select>
            <span class="select-icon">⌄</span>
          </div>
        </td>
        <td>
          <div class="select-shell small">
            <select class="user-type-select">
              <option value="" disabled selected>User type</option>
              <option>RemoteVU - Remote Expert</option>
              <option>CareVU - Patient Side</option>
            </select>
            <span class="select-icon">⌄</span>
          </div>
        </td>
        <td><button type="button" class="row-action remove-row" aria-label="Remove user row">×</button></td>
      `;

      const detailsRow = createDetailsRow();
      bindUserTypeListener(row, row.querySelector('.user-type-select'));

      row.querySelector('.remove-row').addEventListener('click', () => {
        if (userRows.querySelectorAll('.user-row').length > 1) {
          row.remove();
          detailsRow.remove();
          updateAddUserState();
        }
      });

      return { row, detailsRow };
    }

    function collectUserRows() {
      return Array.from(userRows.querySelectorAll('.user-row')).map((row) => {
        const detailsRow = row.nextElementSibling;
        const detailsBody = detailsRow ? detailsRow.querySelector('.details-body') : null;
        return {
          name: row.querySelector('input[placeholder="Name"]').value.trim(),
          email: row.querySelector('input[placeholder="Email"]').value.trim(),
          phone: row.querySelector('input[placeholder="Phone"]').value.trim(),
          role: row.querySelector('select').value,
          userType: row.querySelector('.user-type-select').value,
          devices: detailsBody ? Array.from(detailsBody.querySelectorAll('input[name="devices"]:checked')).map((input) => input.value) : [],
          shippingAddress: detailsBody ? detailsBody.querySelector('textarea').value.trim() : '',
          additionalInfo: detailsBody ? detailsBody.querySelectorAll('textarea')[1].value.trim() : '',
        };
      });
    }

    function resetUserDetailsForm() {
      form.reset();

      Array.from(userRows.querySelectorAll('.user-row')).forEach((row, index) => {
        if (index > 0) {
          const detailsRow = row.nextElementSibling;
          row.remove();
          if (detailsRow && detailsRow.classList.contains('user-details-row')) {
            detailsRow.remove();
          }
        }
      });

      const firstRow = userRows.querySelector('.user-row');
      const firstDetails = firstRow ? firstRow.nextElementSibling : null;

      if (firstRow) {
        const firstType = firstRow.querySelector('.user-type-select');
        if (firstType) {
          firstType.selectedIndex = 0;
          updateCarevuDetails(firstRow, firstType);
        }
      }

      if (firstDetails) {
        toggleDetailsBody(firstDetails, false);
        firstDetails.classList.add('hidden');
      }
      updateAddUserState();
    }

    function restoreUserDetailsDraft() {
      const draft = readUserDetailsDraft();
      if (!draft || !Array.isArray(draft.users)) {
        return;
      }

      Array.from(userRows.querySelectorAll('.user-row')).forEach((row) => {
        const detailsRow = row.nextElementSibling;
        row.remove();
        if (detailsRow && detailsRow.classList.contains('user-details-row')) {
          detailsRow.remove();
        }
      });

      draft.users.slice(0, OnboardingSubmit.MAX_USERS).forEach((user) => {
        const { row, detailsRow } = createUserRow();
        row.querySelector('input[placeholder="Name"]').value = user.name || '';
        row.querySelector('input[placeholder="Email"]').value = user.email || '';
        row.querySelector('input[placeholder="Phone"]').value = user.phone || '';
        row.querySelector('select').value = user.role || 'User';
        row.querySelector('.user-type-select').value = user.userType || '';

        const detailsBody = detailsRow.querySelector('.details-body');
        if (detailsBody) {
          const devices = Array.isArray(user.devices) ? user.devices : [];
          detailsBody.querySelectorAll('input[name="devices"]').forEach((checkbox) => {
            checkbox.checked = devices.includes(checkbox.value);
          });
          detailsBody.querySelector('textarea').value = user.shippingAddress || '';
          detailsBody.querySelectorAll('textarea')[1].value = user.additionalInfo || '';
        }

        updateCarevuDetails(row, row.querySelector('.user-type-select'));
        userRows.appendChild(row);
        userRows.appendChild(detailsRow);
      });
    }

    // splitforms stores flat fields only, so each user becomes a numbered set of columns.
    function buildUserDetailsSubmission(mainForm, users, submissionId) {
      const fields = {
        subject: `New Onboarding Submission - ${mainForm.portalName || 'Unknown portal'} - ${users.length} user${users.length === 1 ? '' : 's'} (${submissionId})`,
        replyto: mainForm.email || '',
        submission_id: submissionId,
        source: 'user-details-form',
        form_for: mainForm.formFor || '',
        portal_name: mainForm.portalName || '',
        first_name: mainForm.firstName || '',
        last_name: mainForm.lastName || '',
        email: mainForm.email || '',
        phone: mainForm.phone || '',
        user_count: users.length,
      };

      users.forEach((user, index) => {
        const prefix = `user_${index + 1}_`;
        fields[`${prefix}name`] = user.name;
        fields[`${prefix}email`] = user.email;
        fields[`${prefix}phone`] = user.phone;
        fields[`${prefix}role`] = user.role;
        fields[`${prefix}user_type`] = user.userType;
        fields[`${prefix}devices`] = OnboardingSubmit.joinList(user.devices);
        fields[`${prefix}shipping_address`] = user.shippingAddress;
        fields[`${prefix}additional_info`] = user.additionalInfo;
      });

      return fields;
    }

    async function handleUserSubmit(event) {
      event.preventDefault();

      const users = collectUserRows().filter((user) => user.name || user.email || user.phone);
      if (users.length === 0) {
        setStatus('Please add at least one user before submitting.', 'error');
        return;
      }
      if (users.length > OnboardingSubmit.MAX_USERS) {
        setStatus(`Please submit at most ${OnboardingSubmit.MAX_USERS} users at a time.`, 'error');
        return;
      }

      setStatus('Submitting your request...', 'loading');
      submitButton.disabled = true;

      try {
        const mainForm = readMainFormDraft() || {};
        const submissionId = OnboardingSubmit.buildSubmissionId();
        await OnboardingSubmit.send(buildUserDetailsSubmission(mainForm, users, submissionId));

        setStatus(`Your user details were submitted successfully. Reference: ${submissionId}`, 'success');
        resetUserDetailsForm();
        clearMainFormDraft();
        clearUserDetailsDraft();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 5000);
      } catch (error) {
        // Keep the entered users so they can retry without retyping.
        setStatus(error.message || 'Submission failed. Please try again.', 'error');
        submitButton.disabled = false;
      }
    }

    addUserRowButton.addEventListener('click', () => {
      if (userRows.querySelectorAll('.user-row').length >= OnboardingSubmit.MAX_USERS) {
        return;
      }
      const { row, detailsRow } = createUserRow();
      userRows.appendChild(row);
      userRows.appendChild(detailsRow);
      updateAddUserState();
      persistUserDetailsDraft();
      row.querySelector('input[placeholder="Name"]').focus();
    });

    const initialRow = userRows.querySelector('.user-row');
    const initialDetailsRow = initialRow.nextElementSibling;

    initialRow.querySelector('.remove-row').addEventListener('click', () => {
      if (userRows.querySelectorAll('.user-row').length > 1) {
        initialRow.remove();
        initialDetailsRow.remove();
        updateAddUserState();
      }
    });

    bindUserTypeListener(initialRow, initialRow.querySelector('.user-type-select'));
    bindDetailsToggle(initialDetailsRow);
    form.addEventListener('input', persistUserDetailsDraft);
    form.addEventListener('change', persistUserDetailsDraft);
    form.addEventListener('submit', handleUserSubmit);
    restoreUserDetailsDraft();
    updateAddUserState();
  </script>
</body>
</html>
