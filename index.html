<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Onboarding Form</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="submit.js"></script>
</head>
<body>
  <div class="page-shell">
    <div class="form-card">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="TeleVU logo" />
      </div>
      <h1>Customer Onboarding Form</h1>
      <form id="main-onboarding-form" class="onboarding-form">
        <fieldset class="field-group radio-group">
          <legend class="field-label">Who is this form for?</legend>
          <label class="radio-item">
            <input type="radio" name="formFor" value="Myself" checked />
            <span>Myself</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="formFor" value="Client" />
            <span>Client</span>
          </label>
        </fieldset>
        <label class="field-group">
          <span class="field-label">Portal Name</span>
          <input type="text" placeholder="Enter portal name" required />
        </label>
        <div class="two-column-row">
          <label class="field-group half">
            <span class="field-label">Your Name</span>
            <div class="name-row">
              <input type="text" placeholder="First Name" required />
              <input type="text" placeholder="Last Name" />
            </div>
          </label>
        </div>
        <label class="field-group">
          <span class="field-label">Your Email</span>
          <input type="email" placeholder="Enter email address" />
        </label>
        <label class="field-group">
          <span class="field-label">Your Phone</span>
          <input type="tel" placeholder="Enter phone number" required />
        </label>
        <div id="client-continue" class="field-group hidden">
          <p class="info-text">Client selected. Continue to the user details page to add users.</p>
          <a id="continue-to-user-details" class="button primary" href="index2.html">Continue to User details</a>
        </div>
        <div id="below-user-details" class="hidden">
          <label class="field-group">
            <span class="field-label">Role</span>
            <div class="select-shell">
              <select>
                <option>User</option>
                <option>Manager</option>
                <option>Guest</option>
                <option>Education</option>
              </select>
              <span class="select-icon">⌄</span>
            </div>
          </label>
          <label class="field-group">
            <span class="field-label">User Type</span>
            <div class="select-shell">
              <select id="user-type-select">
                <option value="" disabled selected>Select user type</option>
                <option>RemoteVU - Remote Expert</option>
                <option>CareVU - Patient Side</option>
              </select>
              <span class="select-icon">⌄</span>
            </div>
          </label>
          <div id="conditional-fields" class="hidden">
            <fieldset class="field-group checkbox-group">
              <legend class="field-label">
                Devices requested <strong>*</strong>
              </legend>
              <label class="checkbox-item">
                <input type="checkbox" name="devices" value="GlassVU" />
                <span>GlassVU - Smart Glasses for AR collaboration</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="devices" value="ScreenVU" />
                <span>ScreenVU - Users who need to stream and share real-time video feeds from medical devices "e.g., endoscopes, ultrasounds, or monitors" into the session.</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="devices" value="CamVU" />
                <span>CamVU - Users who want to use a mobile device as a portable camera source to broadcast from the clinical environment.</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="devices" value="CamVU PTZ" />
                <span>CamVU PTZ - Dedicated high-definition Pan-Tilt-Zoom camera used for detailed viewing of clinical environments</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="devices" value="TeleVU Station" />
                <span>TeleVU Station - Telepresence units (Carts or Rovers) designed for all-in-one solutions</span>
              </label>
            </fieldset>
            <label class="field-group">
              <span class="field-label">Where should the equipment be shipped to?</span>
              <textarea rows="4" placeholder="Enter shipping address"></textarea>
            </label>
            <label class="checkbox-toggle">
              <input type="checkbox" id="required-date-toggle" />
              <span>Is there a required date by which equipment must be received?</span>
            </label>
            <div id="delivery-date-group" class="field-group hidden">
              <label>
                <span class="field-label">Enter the required delivery date</span>
                <input type="date" />
                <span class="field-note">MM/dd/yyyy</span>
              </label>
            </div>
          </div>
          <div id="additional-info-group" class="field-group hidden">
            <label>
              <span class="field-label">Please provide any additional information or special instructions for your onboarding</span>
              <textarea rows="5" placeholder="Enter additional information"></textarea>
            </label>
          </div>
        </div>
        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
        <button id="main-submit" type="submit">Submit Request</button>
      </form>
    </div>
  </div>
  <script>
    const userTypeSelect = document.getElementById('user-type-select');
    const conditionalFields = document.getElementById('conditional-fields');
    const additionalInfoGroup = document.getElementById('additional-info-group');
    const clientContinue = document.getElementById('client-continue');
    const mainSubmit = document.getElementById('main-submit');
    const continueToUserDetails = document.getElementById('continue-to-user-details');
    const requiredDateToggle = document.getElementById('required-date-toggle');
    const deliveryGroup = document.getElementById('delivery-date-group');
    const form = document.getElementById('main-onboarding-form');
    const statusBox = document.getElementById('form-status');
    const MAIN_FORM_DRAFT_KEY = 'onboardingMainFormDraft';

    function persistMainFormDraft() {
      try {
        sessionStorage.setItem(MAIN_FORM_DRAFT_KEY, JSON.stringify(collectMainFormData()));
      } catch (error) {
        // Ignore storage failures and continue navigation/submission.
      }
    }

    function readMainFormDraft() {
      try {
        const raw = sessionStorage.getItem(MAIN_FORM_DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function restoreMainFormDraft() {
      const draft = readMainFormDraft();
      if (!draft) {
        return;
      }

      const selectedFor = draft.formFor || 'Myself';
      const selectedForRadio = form.querySelector(`input[name="formFor"][value="${selectedFor}"]`);
      if (selectedForRadio) {
        selectedForRadio.checked = true;
      }

      form.querySelector('input[placeholder="Enter portal name"]').value = draft.portalName || '';
      form.querySelector('.name-row input[placeholder="First Name"]').value = draft.firstName || '';
      form.querySelector('.name-row input[placeholder="Last Name"]').value = draft.lastName || '';
      form.querySelector('input[type="email"]').value = draft.email || '';
      form.querySelector('input[type="tel"]').value = draft.phone || '';
      form.querySelector('select').value = draft.role || 'User';
      userTypeSelect.value = draft.userType || '';

      const devices = Array.isArray(draft.devices) ? draft.devices : [];
      form.querySelectorAll('input[name="devices"]').forEach((checkbox) => {
        checkbox.checked = devices.includes(checkbox.value);
      });

      form.querySelector('textarea[placeholder="Enter shipping address"]').value = draft.shippingAddress || '';
      form.querySelectorAll('textarea')[1].value = draft.additionalInfo || '';
      const dateInput = form.querySelector('input[type="date"]');
      if (dateInput) {
        dateInput.value = draft.requiredDeliveryDate || '';
      }
      requiredDateToggle.checked = Boolean(draft.requiredDeliveryDate);
      updateDeliveryVisibility();
      updateConditionalFields();
    }

    function clearMainFormDraft() {
      sessionStorage.removeItem(MAIN_FORM_DRAFT_KEY);
    }

    function setStatus(message, type = 'info') {
      statusBox.textContent = message;
      statusBox.className = `form-status ${type}`;
    }

    function updateDeliveryVisibility() {
      deliveryGroup.classList.toggle('hidden', !requiredDateToggle.checked);
    }

    function updateConditionalFields() {
      const selected = userTypeSelect.value;
      const isRemoteExpert = selected === 'RemoteVU - Remote Expert';
      const hasSelection = selected !== '';
      const clientSelected = document.querySelector('input[name="formFor"]:checked').value === 'Client';

      if (!hasSelection) {
        conditionalFields.classList.add('hidden');
        additionalInfoGroup.classList.add('hidden');
      } else if (isRemoteExpert) {
        conditionalFields.classList.add('hidden');
        additionalInfoGroup.classList.remove('hidden');
      } else {
        conditionalFields.classList.remove('hidden');
        additionalInfoGroup.classList.remove('hidden');
      }

      clientContinue.classList.toggle('hidden', !clientSelected);
      mainSubmit.classList.toggle('hidden', clientSelected);
      document.getElementById('below-user-details').classList.toggle('hidden', clientSelected);

      if (!hasSelection) {
        requiredDateToggle.checked = false;
        updateDeliveryVisibility();
      }
    }

    function collectMainFormData() {
      return {
        source: 'main-form',
        formFor: document.querySelector('input[name="formFor"]:checked').value,
        portalName: form.querySelector('input[placeholder="Enter portal name"]').value.trim(),
        firstName: form.querySelector('.name-row input[placeholder="First Name"]').value.trim(),
        lastName: form.querySelector('.name-row input[placeholder="Last Name"]').value.trim(),
        email: form.querySelector('input[type="email"]').value.trim(),
        phone: form.querySelector('input[type="tel"]').value.trim(),
        role: form.querySelector('select').value,
        userType: userTypeSelect.value,
        devices: Array.from(form.querySelectorAll('input[name="devices"]:checked')).map((input) => input.value),
        shippingAddress: form.querySelector('textarea[placeholder="Enter shipping address"]').value.trim(),
        additionalInfo: form.querySelectorAll('textarea')[1]?.value.trim() || '',
        requiredDeliveryDate: form.querySelector('input[type="date"]').value,
      };
    }

    function buildMainSubmission(data, submissionId) {
      return {
        subject: `New Onboarding Submission - ${data.portalName || 'Unknown portal'} (${submissionId})`,
        replyto: data.email,
        submission_id: submissionId,
        source: data.source,
        form_for: data.formFor,
        portal_name: data.portalName,
        first_name: data.firstName,
        last_name: data.lastName,
        email: data.email,
        phone: data.phone,
        role: data.role,
        user_type: data.userType,
        devices: OnboardingSubmit.joinList(data.devices),
        shipping_address: data.shippingAddress,
        additional_info: data.additionalInfo,
        required_delivery_date: data.requiredDeliveryDate,
      };
    }

    async function handleMainSubmit(event) {
      event.preventDefault();

      setStatus('Submitting your request...', 'loading');
      mainSubmit.disabled = true;

      try {
        persistMainFormDraft();

        const submissionId = OnboardingSubmit.buildSubmissionId();
        await OnboardingSubmit.send(buildMainSubmission(collectMainFormData(), submissionId));

        setStatus(`Your request was submitted successfully. Reference: ${submissionId}`, 'success');
        form.reset();
        clearMainFormDraft();
        updateConditionalFields();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 5000);
      } catch (error) {
        // Keep the customer's answers so they can retry without retyping.
        setStatus(error.message || 'Submission failed. Please try again.', 'error');
        mainSubmit.disabled = false;
      }
    }

    function handleContinueToUserDetails(event) {
      event.preventDefault();
      persistMainFormDraft();
      window.location.href = 'index2.html';
    }

    requiredDateToggle.addEventListener('change', updateDeliveryVisibility);
    userTypeSelect.addEventListener('change', updateConditionalFields);
    document.querySelectorAll('input[name="formFor"]').forEach((radio) => {
      radio.addEventListener('change', updateConditionalFields);
    });
    form.addEventListener('input', persistMainFormDraft);
    form.addEventListener('change', persistMainFormDraft);
    continueToUserDetails.addEventListener('click', handleContinueToUserDetails);
    form.addEventListener('submit', handleMainSubmit);
    restoreMainFormDraft();
    updateConditionalFields();
  </script>
</body>
</html>
